replicaCount: 1
image:
  repository: jumapaul/doctor-service
  pullPolicy: Always
  tag: "fc6b8a6"
serviceType: ClusterIP
servicePort: 80
targetPort: 8020
containerPort: 8020
probes:
  liveness:
    path: /actuator/health/liveness
    port: 8020
    initialDelaySeconds: 240
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    port: 8020
    initialDelaySeconds: 240
    periodSeconds: 10
    failureThreshold: 3
configMap:
  data:
    CONFIG_URL: "http://config-service-service:80"
    FIREBASE_JSON_PATH: "/app/doctorq-crds/client_secret.json"
secretVolume:
  name: doctorq-secret-vol
  mountPath: "/app/doctorq-crds"
  secretName: user-client-secret
