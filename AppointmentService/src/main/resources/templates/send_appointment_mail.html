<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.10);
        }
        h2 {
            color: #2a7ae2;
            border-bottom: 2px solid #2a7ae2;
            padding-bottom: 8px;
        }
        .label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
        }
        .value {
            margin-left: 5px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 th:text="${title}"></h2>

    <p>Hello <span th:text="${appointment.patientName}"></span>,</p>

    <p th:text="${description + ' Here are the details:'}"></p>
<!--    <p>Your appointment has been successfully approved. Here are the details:</p>-->

    <div class="appointment-details">
        <p><b>Patient Name:</b> <span th:text="${appointment.patientName}"></span></p>
        <p><b>Age:</b> <span th:text="${appointment.patientAge}"></span></p>
        <p><b>Contact:</b> <span th:text="${appointment.patientContact}"></span></p>
        <p><b>Gender:</b> <span th:text="${appointment.patientGender}"></span></p>
        <p><b>Description of Problem:</b> <span th:text="${appointment.patientDescription}"></span></p>
        <p><b>Appointment Date:</b> <span th:text="${appointment.date}"></span></p>
        <p><b>Appointment Time:</b> <span th:text="${appointment.startTime + 'hrs' + ' - ' + appointment.endTime + 'hrs'}"></span></p>
        <p><b>Doctor Name:</b> <span th:text="${doctorName}"></span></p>
    </div>
    <p>If you need to make changes or cancel the appointment, please contact us.</p>

    <div class="footer">
        This is an automated message. Please do not reply to this email.
    </div>

</div>

</body>
</html>
