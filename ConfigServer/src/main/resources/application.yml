spring:
  application:
    name: config-server
  profiles:
    active: native

  cloud:
    config:
      server:
        jdbc:
          sql: SELECT config_value FROM config WHERE serviceName=?
        native:
          search-locations: classpath:/configurations

  datasource:
    url: ${DATABASE_URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT}