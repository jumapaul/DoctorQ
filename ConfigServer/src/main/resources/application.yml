spring:
  application:
    name: config-server
  profiles:
    active: native

  cloud:
    config:
      server:
        jdbc:
#          enabled: false
          sql: SELECT config_value FROM config WHERE serviceName=?
        native:
          search-locations: classpath:/configurations

  datasource:
    url: ${dataSourceUrl}
    username: ${username}
    password: ${password}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8000



