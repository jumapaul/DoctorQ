apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eureka-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: doctorq
  source:
    repoURL: https://github.com/jumapaul/DoctorQ
    targetRevision: appointment
    path: ./EurekaDiscoveryService/eureka-helm-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: doctorq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true