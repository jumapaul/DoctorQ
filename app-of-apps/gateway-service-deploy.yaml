apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-service
  namespace: argocd
spec:
  project: doctorq
  source:
    repoURL: https://github.com/jumapaul/DoctorQ
    targetRevision: appointment
    path: ./GatewayService/gateway-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true