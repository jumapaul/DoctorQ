services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - doctorq-net

  maildev:
    container_name: mail
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - doctorq-net

