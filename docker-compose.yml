  #We use upstash
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:latest
    hostname: broker
    ports:
      - "9092:9092" # Maps Container Port 9092, default for Kafka client communication, to Host Port 9092
      - "9093:9093" # Maps Container Port 9093, used for advertised listeners for external clients, to Host Port 9093
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093" # Defines who can vote in the controller quorum; part of KRaft. Format nodeId@host:controllerPort
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 # PLAINTEXT is for client communication. CONTROLLER is for internal controller communication
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data  # Path where Kafka stores its logs.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 48 #Keep logs for 2 days
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "d9FdnCKjS6yCth0ZKzZIdg"  # A unique ID for the Kafka cluster.

    volumes:
      - kafka-data:/var/lib/kafka/data  # Store Kafka logs on your local machine.
    networks:
      - doctorq-net
networks:
  doctorq-net:
    driver: bridge

volumes:
  postgres:
  elasticsearch:
  grafana_data:
  kafka-data: