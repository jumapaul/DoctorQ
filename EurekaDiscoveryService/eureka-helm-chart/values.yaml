image:
  repository: jumapaul/eureka-service
  pullPolicy: IfNotPresent
  tag: "5f858a3"
containerPort: 8761
serviceType: NodePort
servicePort: 80
targetPort: 8761
probes:
  liveness:
    path: /actuator/health/liveness
    port: 8761
    initialDelaySeconds: 120
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    port: 8761
    initialDelaySeconds: 120
    periodSeconds: 10
    failureThreshold: 3
configMap:
  data:
    CONFIG_URL: "http://config-service-service:80"
